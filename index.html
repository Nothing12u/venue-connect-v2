<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="description" content="Venture Connect is a startup ecosystem platform that helps student founders build their ideas, discover opportunities, and connect with investors and incubators through a trusted evaluation process." />
<title>Venture Connect  Startup Ecosystem Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
<link rel="icon" type="image/png" href="assets/logo/logo-app.png" />
<link rel="apple-touch-icon" href="assets/logo/logo-app.png" />
</head>
<body>
  <div id="app">
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:Inter,sans-serif;color:#666">Loading Venture Connect…</div>
  </div>
  <div id="toast-root" aria-live="polite"></div>
  <div id="modal-root"></div>
  <div id="drawer-root"></div>
  <div id="menu-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages-landing.js"></script>
  <script src="js/pages-founder.js"></script>
  <script src="js/pages-founder-stages.js"></script>
  <script src="js/pages-investor.js"></script>
  <script src="js/pages-shared.js"></script>
  <script src="js/pages-internal.js"></script>
  <script src="js/pages-auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    Store.init().then(() => App.init()).catch((e) => {
      console.error("Boot failed:", e);
      document.getElementById("app").innerHTML =
        '<div style="max-width:520px;margin:80px auto;font-family:Inter,sans-serif;text-align:center;color:#b00">' +
        '<h2>Could not connect to Venture Connect</h2>' +
        '<p>Check that js/supabase-config.js has your real Supabase project URL and anon key, and that supabase/schema.sql has been run in your project.</p>' +
        '</div>';
    });
  </script>
</body>
</html>
